name: CI

# Professional-standard gate: every PR and every push to main must pass
# typecheck, the full unit suite, lint, and a production build before it
# can merge. Branch protection (set in repo settings) makes this required.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Provenance migration rehearsal
        run: npm run rehearse:migration

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          # The app is engineered to build without a database (fail-soft
          # render). No secrets are required for the build gate.
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_TURBOPACK_EXPERIMENTAL_USE_SYSTEM_TLS_CERTS: "1"
