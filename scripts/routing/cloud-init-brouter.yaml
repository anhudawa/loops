#cloud-config
# ============================================================
# LOOPS routing engine — official BRouter 1.7.10 as a systemd service (v3)
# GENERATED from cloud-init-brouter.template.yaml + profiles/*.brf by
#   node scripts/routing/build-cloud-init.mjs
# Edit the template or the profiles, never this file.
# ============================================================
# Self-configures on first boot via Hetzner user_data (no SSH needed).
# v1 failed because it referenced a Docker image that doesn't exist. v2 runs
# the maintainers' own release jar directly — the exact invocation verified
# locally against a real Ireland tile with fastbike/gravel/mtb/loops-road.
#
# Tiles (5°x5° BRouter segments, ~1.5GB total): Ireland/UK W15_N50 W10_N50 W5_N50 ·
# Catalonia E0_N40 · SE France E5_N40 · Tuscany E10_N40 · Mallorca/Alicante
# E0_N35 W5_N35 · Algarve W10_N35 · Canaries W20_N25 W15_N25

package_update: true
package_upgrade: true
packages:
  - openjdk-21-jre-headless
  - unzip
  - curl
  - ufw
  - fail2ban
  - unattended-upgrades

ssh_pwauth: false
write_files:
  - path: /etc/ssh/sshd_config.d/99-loops-hardening.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      PermitRootLogin prohibit-password
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/fail2ban/jail.local
    permissions: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 4
      bantime = 1h
  - path: /opt/brouter/install.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      cd /opt/brouter
      # Official release (verified: github.com/abrensch/brouter v1.7.10)
      if [ ! -f brouter-1.7.10/brouter-1.7.10-all.jar ]; then
        curl -fSL --retry 4 --retry-delay 5 -o brouter-1.7.10.zip \
          https://github.com/abrensch/brouter/releases/download/v1.7.10/brouter-1.7.10.zip
        unzip -q -o brouter-1.7.10.zip
      fi
      # LOOPS profiles must live in profiles2 (named profiles resolve there).
      # loops-road = the Road Standard; loops-road-relaxed = fallback that
      # the app only uses when the strict profile finds no route at all.
      python3 /opt/brouter/profiles/derive-relaxed.py
      cp /opt/brouter/profiles/*.brf brouter-1.7.10/profiles2/
      mkdir -p segments4 custom
      BASE=https://brouter.de/brouter/segments4
      for t in W15_N50 W10_N50 W5_N50 E0_N40 E5_N40 E10_N40 E0_N35 W5_N35 W10_N35 W20_N25 W15_N25; do
        [ -s "segments4/$t.rd5" ] || curl -fSL --retry 4 --retry-delay 5 -o "segments4/$t.rd5" "$BASE/$t.rd5" || echo "WARN: $t unavailable upstream"
      done
      ls -lh segments4
  - path: /etc/systemd/system/brouter.service
    permissions: "0644"
    content: |
      [Unit]
      Description=LOOPS routing engine (BRouter 1.7.10)
      After=network-online.target
      Wants=network-online.target
      [Service]
      # NOTE: the custom-profile directory MUST be given relative to the
      # profiles directory (the upload handler concatenates them). With
      # ../../custom, POST /brouter/profile[/custom_<id>] stores or updates a
      # profile on the server — the app can ship profile changes without SSH.
      WorkingDirectory=/opt/brouter/brouter-1.7.10
      ExecStart=/usr/bin/java -Xmx2g -cp brouter-1.7.10-all.jar btools.server.RouteServer /opt/brouter/segments4 /opt/brouter/brouter-1.7.10/profiles2 ../../custom 17777 4
      Restart=always
      RestartSec=5
      [Install]
      WantedBy=multi-user.target
  - path: /opt/brouter/profiles/loops-road.brf
    permissions: "0644"
    content: |
      #
      # A fastbike could be a racing bike or a speed pedelec.
      # But also at night or in rainy weather you might want
      # to fallback to this one.
      #
      # Structure is similar to trekking.brf, see this for documentation.
      #
      # With default configuration (tested for Europe), trunks are
      # strongly avoided even if there's no bike restriction
      # (assuming implicit bicycle=no), and motorways are not allowed
      # even with bicycle=yes). This is not the expected behavior for some countries
      # such as Japan or Australia.
      # Then, you should switch allow_motorways variable to true for these regions.
      #

      ---context:global   # following code refers to global config

      # Bike profile
      assign validForBikes = true

      # Use the following switches to change behaviour
      assign allow_steps           = true   # %allow_steps% | Set to false to disallow steps | boolean
      assign allow_ferries         = true   # %allow_ferries% | set to false to disallow ferries | boolean
      assign allow_motorways       = false  # %allow_motorways% | Set to true to allow motorways (useful in Asia / Oceania for example) | boolean

      assign use_proposed_cycleroutes = false  # %use_proposed_cycleroutes% | Set to true to consider proposed and regular cycleroutes as equals | boolean

      assign consider_traffic      = 0.1      # %consider_traffic% | avoiding roads that usually have traffic is? | [1=very important, 0.5=pretty important, 0.3=important, 0.1=slightly preferred, 0.0=do not consider traffic]
      assign consider_noise        = false  # %consider_noise% | Activate to prefer a low-noise route | boolean
      assign consider_river        = false  # %consider_river% | Activate to prefer a route along rivers, lakes, etc. | boolean
      assign consider_forest       = false  # %consider_forest% | Activate to prefer a route in forest or parks | boolean
      assign consider_town         = false  # %consider_town% | Activate to bypass cities / big towns as far as possible | boolean


      # Change elevation parameters
      assign consider_elevation = true  # %consider_elevation% | Set to false to ignore elevation in routing | boolean
      assign downhillcost       = 60    # %downhillcost% | Cost for going downhill | number
      assign downhillcutoff     = 1.5   # %downhillcutoff% | Gradients below this value in percents are not counted. | number
      assign uphillcost         = 0     # %uphillcost% | Cost for going uphill | number
      assign uphillcutoff       = 1.5   # %uphillcutoff% | Gradients below this value in percents are not counted.  | number

      assign downhillcost       = if consider_elevation then downhillcost else 0
      assign uphillcost         = if consider_elevation then uphillcost else 0

      # Kinematic model parameters (travel time computation)
      assign totalMass  = 90     # %totalMass% | Mass (in kg) of the bike + biker, for travel time computation | number
      assign maxSpeed   = 45     # %maxSpeed% | Absolute maximum speed (in km/h), for travel time computation | number
      assign S_C_x      = 0.225  # %S_C_x% | Drag coefficient times the reference area (in m^2), for travel time computation | number
      assign C_r        = 0.01   # %C_r% | Rolling resistance coefficient (dimensionless), for travel time computation | number
      assign bikerPower = 100    # %bikerPower% | Average power (in W) provided by the biker, for travel time computation | number

      # Turn instructions settings
      assign turnInstructionMode          = 1     # %turnInstructionMode% | Mode for the generated turn instructions | [0=none, 1=auto-choose, 2=locus-style, 3=osmand-style, 4=comment-style, 5=gpsies-style, 6=orux-style, 7=locus-old-style]
      assign turnInstructionCatchingRange = 40    # %turnInstructionCatchingRange% | Within this distance (in m) several turning instructions are combined into one and the turning angles are better approximated to the general direction | number
      assign turnInstructionRoundabouts   = true  # %turnInstructionRoundabouts% | Set to "false" to avoid generating special turning instructions for roundabouts | boolean
      assign considerTurnRestrictions     = true  # %considerTurnRestrictions% | Set to true to take turn restrictions into account | boolean

      # with engine defaults, long parts of routing to via points may be removed
      assign correctMisplacedViaPoints = true  # %correctMisplacedViaPoints% | Set to true to remove detours due to via points (going back and forth on the same route) | boolean
      assign correctMisplacedViaPointsDistance = 400 # %correctMisplacedViaPointsDistance% | Only remove detours shorter than this (one-way) distance (in m) (engine defaults to 0 which removes detours whatever their length) | number

      assign processUnusedTags            = false # %processUnusedTags% | Set to true to output unused tags in data tab | boolean


      ---context:way   # following code refers to way-tags

      assign any_cycleroute
        switch not use_proposed_cycleroutes
          or route_bicycle_icn=yes or route_bicycle_ncn=yes or route_bicycle_rcn=yes route_bicycle_lcn=yes
          or route_bicycle_icn=yes|proposed or route_bicycle_ncn=yes|proposed or route_bicycle_rcn=yes|proposed route_bicycle_lcn=yes|proposed

      assign nodeaccessgranted or any_cycleroute lcn=yes

      assign ispaved or surface=paved or surface=asphalt or surface=concrete or surface=paving_stones or surface=sett or smoothness=excellent smoothness=good
      assign isunpaved not or ispaved or ( and surface= smoothness= ) or surface=fine_gravel or surface=cobblestone smoothness=intermediate

      assign turncost = if junction=roundabout then 0
                        else 90
      assign initialclassifier =
           if route=ferry then 1
           else 0

      assign initialcost switch route=ferry 10000 0

      #
      # implicit access here just from the motorroad tag
      # (implicit access rules from highway tag handled elsewhere)
      #
      assign defaultaccess
             switch access=
                    (
                          if motorroad=yes then false
                          else if highway=motorway|motorway_link then false
                          else true
                    )
                    switch or access=private access=no
                           false
                           true

      #
      # calculate logical bike access
      #
      assign bikeaccess =
             switch bicycle=
                    switch bicycle_road=yes
                       true
                       switch vehicle=
                              ( if highway=footway then false else defaultaccess )
                              not vehicle=private|no
                    not or bicycle=private or bicycle=no or bicycle=dismount bicycle=use_sidepath

      #
      # calculate logical foot access
      #
      assign footaccess =
             or bicycle=dismount
                switch foot=
                       defaultaccess
                       not or foot=private or foot=no foot=use_sidepath

      #
      # if not bike-, but foot-acess, just a moderate penalty,
      # otherwise access is forbidden
      #
      assign accesspenalty
             switch bikeaccess
                    0
                    switch footaccess
                           40   # LOOPS: foot-only ways (push the bike) — only when there is no other way
                           switch any_cycleroute
                                  15
                                  switch bicycle=use_sidepath
                                         25
                                         10000

      #
      # handle one-ways. On primary roads, wrong-oneways should
      # be close to forbidden, while on other ways we just add
      # 6 to the costfactor (making it at least 7 - you are allowed
      # to push your bike)
      #
      assign badoneway =
             if reversedirection=yes then
               if oneway:bicycle=yes then true
               else if oneway= then junction=roundabout
               else oneway=yes|true|1
             else oneway=-1

      assign hascycleway = not
        and ( or cycleway= cycleway=no|none ) and ( or cycleway:left= cycleway:left=no ) and ( or cycleway:right= cycleway:right=no ) ( or cycleway:both= cycleway:both=no )

      assign onewaypenalty =
             if ( badoneway ) then
             (
               if (
                 and hascycleway
                 or and cycleway:left=lane|track|shared_lane|share_busway
                        cycleway:left:oneway=no|-1
                 or and cycleway:right=lane|track|shared_lane|share_busway
                        cycleway:right:oneway=no|-1
                 or and cycleway:both=lane|track|shared_lane|share_busway
                        #or cycleway:both:oneway=no|-1
                        or cycleway:left:oneway=no|-1
                           cycleway:right:oneway=no|-1
                 or cycleway=opposite|opposite_lane|opposite_track
                 or cycleway:left=opposite|opposite_lane|opposite_track
                    cycleway:right=opposite|opposite_lane|opposite_track
                                                                   ) then 0
               else if ( oneway:bicycle=no                         ) then 0
               else if ( not footaccess                            ) then 100
               else if ( junction=roundabout|circular              ) then 60
               else if ( highway=primary|primary_link              ) then 50
               else if ( highway=secondary|secondary_link          ) then 30
               else if ( highway=tertiary|tertiary_link            ) then 20
               else 6.0
             )
             else 0.0

      # Eventually compute traffic penalty
      assign trafficpenalty =
            if not consider_traffic then 0
            else
            min switch hascycleway 0.3 100   # trafficpenalty not above 0.3 if a cycleway is present
            if   estimated_traffic_class=|1|2  then 0
            else if estimated_traffic_class=3 then multiply   0.3   consider_traffic
            else if estimated_traffic_class=4 then multiply   0.6   consider_traffic
            else if estimated_traffic_class=5 then multiply   0.9   consider_traffic
            else if estimated_traffic_class=6|7 then multiply 1.5   consider_traffic
            else 0

      assign isresidentialorliving = or highway=residential|living_street living_street=yes

      # add estimate tags
      assign noise_penalty
         switch consider_noise
           switch estimated_noise_class=  0
           switch estimated_noise_class=1  0.3
           switch estimated_noise_class=2  0.5
           switch estimated_noise_class=3  0.7
           switch estimated_noise_class=4  1
           switch estimated_noise_class=5  1.2
           switch estimated_noise_class=6  1.5 0 0

      assign no_river_penalty
         switch consider_river
           switch estimated_river_class=  3
           switch estimated_river_class=1  2
           switch estimated_river_class=2  1.5
           switch estimated_river_class=3  1
           switch estimated_river_class=4  0.5
           switch estimated_river_class=5  0.2
           switch estimated_river_class=6  0 99 0

      assign no_forest_penalty
         switch consider_forest
           switch estimated_forest_class=  1
           switch estimated_forest_class=1  0.5
           switch estimated_forest_class=2  0.4
           switch estimated_forest_class=3  0.25
           switch estimated_forest_class=4  0.15
           switch estimated_forest_class=5  0.1
           switch estimated_forest_class=6  0 99 0

      assign town_penalty
         switch consider_town
           switch estimated_town_class=  0
           switch estimated_town_class=1  0.2
           switch estimated_town_class=2  0.4
           switch estimated_town_class=3  0.6
           switch estimated_town_class=4  0.7
           switch estimated_town_class=5  0.8
           switch estimated_town_class=6  1 99 0

      assign costfactor
        switch and highway= not route=ferry  10000
        switch or highway=proposed highway=abandoned 10000
        min 9999
        add max onewaypenalty accesspenalty
        add trafficpenalty
        add town_penalty
        add no_forest_penalty
        add no_river_penalty
        add noise_penalty
        # ── LOOPS ROAD STANDARD (CEO, 2026-09-21) ────────────────────────────────
        # Rule 1: no main roads. Motorways impossible; trunk/primary cost 60x/30x —
        # the engine's cost ceiling (9999) made a 200 m primary link dearer than a
        # 70 km detour, so Girona loops ballooned to 200 km with 80 km of retrace.
        # At 30x a 300 m link costs like 9 km of quiet lane: taken only when the
        # alternative is absurd, and ALWAYS named by the compromise detector.
        switch or highway=motorway highway=motorway_link    10000
        switch or highway=trunk highway=trunk_link          60.0
        switch or highway=primary highway=primary_link      30.0
        # Rule 2: no 80 km/h+ roads unless there is a segregated cycle track —
        # applied to roads that are actually fast: 100 km/h+ on any class, or
        # 80/90 on regional roads (secondary+) or on lanes the engine estimates
        # as busy. A quiet tertiary/unclassified lane with the nominal rural
        # default limit (80 IE, 90 ES/FR) is a quiet lane. (Literal application
        # left Girona with no routable loop.) Mirrors isFastRoad() in the app.
        switch and maxspeed=100|110|120|130
                   not or highway=cycleway or cycleway=track or cycleway:left=track or cycleway:right=track cycleway:both=track
               20.0
        switch and maxspeed=80|90
               and ( or and highway=secondary|secondary_link not estimated_traffic_class=1|2|3
                        estimated_traffic_class=4|5|6|7 )
                   not or highway=cycleway or cycleway=track or cycleway:left=track or cycleway:right=track cycleway:both=track
               20.0
        # Rule 4: paved only. Explicitly unpaved is forbidden; untagged minor roads
        # are assumed paved (as the surface scorer does).
        switch or isunpaved surface=unpaved|gravel|fine_gravel|compacted|dirt|earth|grass|ground|mud|sand|pebblestone|rock|stone|clay|grass_paver  10000
        switch or highway=track or highway=path or highway=bridleway highway=footway  10000
        switch highway=steps 10000
        switch route=ferry switch allow_ferries 5.67 10000
        # Rule 3: avoid anything tagged bad/dangerous for cycling.
        switch class:bicycle=-3|-2  10000
        switch smoothness=bad|very_bad|horrible|very_horrible|impassable  10000
        # Rule 5: quiet lanes win even when longer — busier classes cost far more,
        # so a better road always beats a shorter route.
        # A regional road the engine estimates quiet (traffic class 1–3: the
        # Military Road over the Dublin mountains, the Ma-roads round Pollença)
        # is the road riders go there for — 1.5×, not 3× (DRAW-04: Rathfarnham →
        # Sally Gap went 31 km round it instead of 23 km over it). Busy or
        # unknown regional roads stay at 3×.
        switch and ( or highway=secondary highway=secondary_link ) estimated_traffic_class=1|2|3  1.5
        switch or highway=secondary highway=secondary_link  3.0
        switch or highway=tertiary highway=tertiary_link    1.0
        switch    highway=unclassified                      1.0
        switch    highway=cycleway                          1.0
        switch    isresidentialorliving                     1.1
        switch    highway=service                           1.4
        switch    highway=pedestrian                        switch hascycleway 1.5 10000
        switch    highway=road                              2.0
        10.0
      assign priorityclassifier =

        if      ( highway=motorway                         ) then  30
        else if ( highway=motorway_link                    ) then  29
        else if ( highway=trunk                            ) then  28
        else if ( highway=trunk_link                       ) then  27
        else if ( highway=primary                          ) then  26
        else if ( highway=primary_link                     ) then  25
        else if ( highway=secondary                        ) then  24
        else if ( highway=secondary_link                   ) then  23
        else if ( highway=tertiary                         ) then  22
        else if ( highway=tertiary_link                    ) then  21
        else if ( highway=unclassified                     ) then  20
        else if ( isresidentialorliving                    ) then  6
        else if ( highway=service                          ) then  6
        else if ( highway=cycleway                         ) then  6
        else if ( or bicycle=designated bicycle_road=yes   ) then  6
        else if ( highway=track                            ) then if tracktype=grade1 then 6 else 4
        else if ( highway=bridleway|road|path|footway      ) then  4
        else if ( highway=steps                            ) then  2
        else if ( highway=pedestrian                       ) then  2
        else 0


      # some more classifying bits used for voice hint generation...

      assign isbadoneway = not equal onewaypenalty 0
      assign isgoodoneway = if reversedirection=yes then oneway=-1
                            else if oneway= then junction=roundabout else oneway=yes|true|1
      assign isroundabout = junction=roundabout
      assign islinktype = highway=motorway_link|trunk_link|primary_link|secondary_link|tertiary_link
      assign isgoodforcars = if greater priorityclassifier 6 then true
                        else if ( or isresidentialorliving highway=service ) then true
                        else if ( and highway=track tracktype=grade1 ) then true
                        else false

      # ... encoded into a bitmask

      assign classifiermask add          isbadoneway
                            add multiply isgoodoneway   2
                            add multiply isroundabout   4
                            add multiply islinktype     8
                                multiply isgoodforcars 16

      # include `smoothness=` tags in the response's WayTags for track analysis
      assign dummyUsage = smoothness=


      ---context:node  # following code refers to node tags

      assign defaultaccess
             switch access=
                    1 # add default barrier restrictions here!
                    switch or access=private access=no
                           0
                           1

      assign bikeaccess
             or nodeaccessgranted=yes
                switch bicycle=
                       switch vehicle=
                              defaultaccess
                              switch or vehicle=private vehicle=no
                                     0
                                     1
                       switch or bicycle=private or bicycle=no bicycle=dismount
                              0
                              1

      assign footaccess
             or bicycle=dismount
                switch foot=
                       defaultaccess
                       switch or foot=private foot=no
                              0
                              1

      assign initialcost
          switch or highway=traffic_signals and highway=crossing crossing=traffic_signals 20
             switch bikeaccess
                    0
                    switch footaccess
                           300
                           1000000
  - path: /opt/brouter/profiles/loops-trace.brf
    permissions: "0644"
    content: |
      # LOOPS trace profile — follow whatever the stored track rides on.
      #
      # Used ONLY to measure an existing route (src/lib/road-trace.ts), never to
      # generate one: every road, path and track is passable at the same cost,
      # access tags are ignored, so the engine returns the roads as ridden and the
      # classifier (road-segments.ts) says what each metre means — main road,
      # fast road, unpaved, unsuitable. A bike profile would detour around a
      # bicycle=no tunnel or a private lane and the trace would not be the ride.

      ---context:global

      assign validForBikes = true
      assign validForCars = false
      assign pass1coefficient = 1.5
      assign pass2coefficient = 0
      assign turnInstructionMode = 0
      assign considerTurnAngles = false

      assign downhillcost = 0
      assign downhillcutoff = 0
      assign uphillcost = 0
      assign uphillcutoff = 0
      assign elevationpenaltybuffer = 0
      assign elevationmaxbuffer = 0
      assign elevationbufferreduce = 0

      ---context:way

      assign turncost = 0
      assign initialcost = 0
      assign onewaypenalty = 0

      # Everything with a highway tag is passable. Motorways are a last resort
      # (no ride uses them; without this the trace snaps onto a parallel
      # autovía) and main roads cost a little more than lanes, so between two
      # via points the engine keeps the track's own road unless the main road
      # is much shorter. Ferries allowed, dearly.
      assign costfactor =
        if highway= then ( if route=ferry then 5 else 10000 )
        else if highway=motorway|motorway_link then 100
        else if highway=trunk|trunk_link|primary|primary_link then 1.2
        else if highway=secondary|secondary_link then 1.1
        else 1

      ---context:node

      assign initialcost = 0
  - path: /opt/brouter/profiles/derive-relaxed.py
    permissions: "0755"
    content: |
      #!/usr/bin/env python3
      # Derive loops-road-relaxed.brf from loops-road.brf (same edits as
      # scripts/routing/build-cloud-init.mjs — kept in one place).
      import json, sys
      EDITS = json.loads("[[\"  switch or highway=trunk highway=trunk_link          60.0\\n\",\"  switch or highway=trunk highway=trunk_link          15.0\\n\"],[\"  switch or highway=primary highway=primary_link      30.0\\n\",\"  switch or highway=primary highway=primary_link      8.0\\n\"],[\"cycleway:both=track\\n         20.0\\n  switch and maxspeed=80|90\\n\",\"cycleway:both=track\\n         6.0\\n  switch and maxspeed=80|90\\n\"],[\"             not or highway=cycleway or cycleway=track or cycleway:left=track or cycleway:right=track cycleway:both=track\\n         20.0\\n  # Rule 4\",\"             not or highway=cycleway or cycleway=track or cycleway:left=track or cycleway:right=track cycleway:both=track\\n         6.0\\n  # Rule 4\"],[\"  # ── LOOPS ROAD STANDARD (CEO, 2026-09-21) ────────────────────────────────\\n  # Rule 1: no main roads. Motorways impossible; trunk/primary cost 60x/30x —\\n\",\"  # ── LOOPS ROAD STANDARD — RELAXED FALLBACK (see header) ─────────────────\\n  # Rule 1: main roads are a last resort (motorways still forbidden).\\n  # trunk/primary cost 60x/30x —\\n\"]]")
      s = open('/opt/brouter/profiles/loops-road.brf').read()
      for a, b in EDITS:
          assert s.count(a) == 1, a[:50]
          s = s.replace(a, b)
      open('/opt/brouter/profiles/loops-road-relaxed.brf', 'w').write(s)
      print('loops-road-relaxed.brf derived')
runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 17777/tcp
  - ufw --force enable
  - systemctl restart ssh
  - systemctl enable --now fail2ban
  - /opt/brouter/install.sh
  - systemctl daemon-reload
  - systemctl enable --now brouter
  - sleep 15 && curl -s "http://localhost:17777/brouter?lonlats=-6.11,53.57|-6.09,53.52&profile=loops-road&alternativeidx=0&format=geojson" | head -c 160 || true
  - touch /var/lib/loops-brouter-ready

final_message: "LOOPS routing engine ready on :17777 after $UPTIME seconds"
